<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="摸鱼阅读">
    <meta name="theme-color" content="#0f1115">
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:book-open.svg?color=%232dd4c0">
    <title>OpenReader Pro · 极简摸鱼聚合阅读</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #0f1115;
            --bg-card: #181a20;
            --bg-card-hover: #22252e;
            --border: #282c35;
            --text-main: #e2e4e9;
            --text-muted: #8b92a0;
            --accent: #2dd4c0;
            --accent-glow: rgba(45, 212, 192, 0.15);
            --reader-font-size: 17px;
            --reader-line-height: 1.9;
        }

        body[data-theme="warm"] {
            --bg-base: #f7f1e3;
            --bg-card: #ede3cb;
            --bg-card-hover: #e2d7bd;
            --border: #ded1b4;
            --text-main: #2f2a24;
            --text-muted: #6e6456;
            --accent: #8b572a;
            --accent-glow: rgba(139, 87, 42, 0.15);
        }

        body[data-theme="stealth"] {
            --bg-base: #1e1e1e;
            --bg-card: #252526;
            --bg-card-hover: #2d2d2d;
            --border: #3e3e42;
            --text-main: #cccccc;
            --text-muted: #6a9955;
            --accent: #569cd6;
            --accent-glow: rgba(86, 156, 214, 0.12);
            font-family: Consolas, "Fira Code", Monaco, monospace !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: constant(safe-area-inset-bottom);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.2s, color 0.2s;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            background: var(--accent-glow);
            border: 1px solid var(--accent);
            border-radius: 4px;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        button.btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        button.btn:active { transform: scale(0.96); }
        button.btn.primary { background: var(--accent); color: #000; font-weight: 600; border: none; }
        button.btn.secondary { background: rgba(255, 255, 255, 0.08); border-color: var(--border); }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 12px;
        }

        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .tab-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .tab-nav-btn.active {
            background: var(--accent-glow);
            color: var(--accent);
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-input {
            flex: 1;
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            -webkit-appearance: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .filter-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .select-filter {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { border-color: var(--accent); }
        .card:active { transform: scale(0.98); }

        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }
        .card-tag { font-size: 11px; color: var(--accent); }

        #detailView, #readerView { display: none; }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            margin-top: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .chap-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chap-btn:active { background: var(--accent-glow); }
        .chap-btn.read-active { border-color: var(--accent); background: var(--accent-glow); font-weight: 600; }

        .reader-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 14px;
            min-height: 60vh;
        }

        .reader-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .font-adjust {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .img-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .img-stream img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        .text-stream {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            white-space: pre-wrap;
            padding: 12px 8px;
            word-break: break-word;
            text-align: justify;
        }

        .pager {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .pager button { flex: 1; padding: 12px; }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .source-switch-list {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .switch-item {
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s;
        }
        .switch-item:hover { border-color: var(--accent); background: var(--accent-glow); }
        .switch-item.recommended { border-color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="brand" onclick="switchNav('shelf')">
        <i class="fas fa-book-open"></i>
        <span>OpenReader Pro</span>
        <span class="badge" id="sourceVerTag">全网开源多源版</span>
    </div>
    <div class="header-actions">
        <button class="btn" title="切换护眼模式" onclick="toggleTheme('warm')"><i class="fas fa-sun"></i> 羊皮纸</button>
        <button class="btn" title="一键开启摸鱼隐蔽代码伪装 (快捷键: ESC)" onclick="toggleStealth()"><i class="fas fa-mask"></i> 摸鱼模式</button>
    </div>
</header>

<main>
    <div class="tab-nav">
        <button class="tab-nav-btn active" id="navShelfBtn" onclick="switchNav('shelf')"><i class="fas fa-bookmark"></i> 我的书架</button>
        <button class="tab-nav-btn" id="navSearchBtn" onclick="switchNav('search')"><i class="fas fa-compass"></i> 全网搜索</button>
    </div>

    <section id="shelfSection">
        <div id="shelfGrid" class="grid-list"></div>
        <div id="shelfEmpty" style="text-align: center; color: var(--text-muted); padding: 50px 0; display: none;">
            书架暂无书籍，点击上方【全网搜索】发现海量小说与漫画！
        </div>
    </section>

    <section id="searchSection" style="display: none;">
        <div class="search-box">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="输入作品名或作者搜索..." value="剑来" onkeydown="if(event.key==='Enter')doSearch()" />
                <button class="btn primary" onclick="doSearch()"><i class="fas fa-search"></i> 搜索</button>
            </div>
            <div class="filter-row">
                <label style="font-size: 12px; color: var(--text-muted);">分类：</label>
                <select id="tabSelect" class="select-filter" onchange="onTabChanged()">
                    <option value="小说" selected>小说</option>
                    <option value="漫画">漫画</option>
                </select>

                <label style="font-size: 12px; color: var(--text-muted); margin-left: 8px;">检索书源：</label>
                <select id="sourceSelect" class="select-filter"></select>
                <span style="font-size: 11px; color: var(--text-muted); margin-left: 6px;">(选【⚡ 全网优质源聚合并发】可一键比对全网)</span>
            </div>
        </div>

        <div id="resultsGrid" class="grid-list"></div>
    </section>

    <section id="detailView">
        <div class="view-header">
            <button class="btn" onclick="goBackFromDetail()"><i class="fas fa-arrow-left"></i> 返回</button>
            <h3 id="detailBookTitle" style="font-size: 16px;">书籍详情</h3>
            <div style="display: flex; gap: 8px;">
                <button class="btn" onclick="openSwitchSourceModal()"><i class="fas fa-random"></i> 换源</button>
                <button class="btn primary" id="shelfToggleBtn" onclick="toggleBookShelf()"><i class="fas fa-plus"></i> 加书架</button>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span class="card-tag" id="detailSourceTag"></span>
            <span style="font-size: 12px; color: var(--text-muted);" id="detailAuthorTag"></span>
        </div>
        <p id="detailIntro" style="font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 16px;"></p>
        
        <h4 style="font-size: 14px; margin-bottom: 8px;">📑 完整章节目录</h4>
        <div id="catalogList" class="catalog-grid"></div>
    </section>

    <section id="readerView">
        <div class="view-header">
            <button class="btn" onclick="showView('detail')"><i class="fas fa-arrow-left"></i> 目录</button>
            <h3 id="readerChapTitle" style="font-size: 14px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">章节标题</h3>
            <div style="display:flex; gap:6px;">
                <button class="btn" onclick="openSwitchSourceModal()"><i class="fas fa-random"></i> 换源</button>
                <button class="btn" onclick="toggleStealth()"><i class="fas fa-mask"></i> 摸鱼</button>
            </div>
        </div>

        <div class="reader-toolbar" id="readerToolbar">
            <span id="readProgressText" style="color:var(--text-muted);">进度更新中...</span>
            <div class="font-adjust">
                <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="adjustFontSize(-1)">A -</button>
                <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="adjustFontSize(1)">A +</button>
            </div>
        </div>

        <div class="reader-wrapper" id="readerContainer">
            <div style="text-align: center; color: var(--text-muted); padding: 40px;">正在加载正文...</div>
        </div>

        <div class="pager">
            <button class="btn" id="prevBtn" onclick="prevChapter()">上一章 (←)</button>
            <button class="btn primary" id="nextBtn" onclick="nextChapter()">下一章 (→)</button>
        </div>
    </section>
</main>

<div class="modal-overlay" id="sourceModal">
    <div class="modal-card">
        <div class="modal-head">
            <span style="font-weight: 600;"><i class="fas fa-bolt" style="color:var(--accent);"></i> 智能无缝换源比对</span>
            <button class="btn" onclick="closeSourceModal()">✕</button>
        </div>
        <div style="padding: 10px 14px; background: rgba(0,0,0,0.15); font-size: 12px; color: var(--text-muted);">
            点击任意书源，将<strong>自动定位并无缝同步当前章节进度</strong>：
        </div>
        <div class="source-switch-list" id="sourceSwitchList"></div>
    </div>
</div>

<script>

    // ====================================================================
    // OpenReader Standalone Core Engine (完全免配置 · 点开即用 · 纯前端自驱动)
    // ====================================================================

    const DIRECT_HOST_POOL = [
        'https://v5.qingtian618.com',
        'https://v2.qingtian618.com',
        'https://v3.qingtian618.com',
        'https://cdn.qingtian618.com',
        'https://v1.qingtian618.com'
    ];

    const STANDALONE_RECOMMENDED_NOVELS = [
        '七猫', '百度', '淘小说', '番茄', '江湖', '熊猫', '笔趣阁78', '伪69', '得间'
    ];

    async function directFetchWithFailover(apiPath) {
        let lastErr = null;
        for (const host of DIRECT_HOST_POOL) {
            try {
                const target = host + apiPath;
                const r = await window.__rawFetch(target, { signal: AbortSignal.timeout(2200) });
                if (!r.ok) continue;
                const d = await r.json();

                if (d.code === 0 && (d.content || d.data)) return d;
                if (Array.isArray(d.data) && d.data.length > 0) return d;
                if (d.content && typeof d.content === 'string' && d.content.length > 50 && !d.content.includes('免登录访问次数已达上限')) {
                    return d;
                }
                if (d.msg && (d.msg.includes('专享') || d.msg.includes('打赏') || d.msg.includes('SVIP'))) {
                    return d;
                }
                lastErr = d.msg || '节点无数据';
            } catch(e) {
                lastErr = e.message;
            }
        }
        throw new Error(lastErr || '所有节点暂时不可用');
    }

    // 保存原生 fetch
    window.__rawFetch = window.fetch;

    // 智能拦截所有 /api/ 请求，纯前端就地处理，无需任何服务端和手动设置
    window.fetch = async function(input, initOptions) {
        if (typeof input !== 'string' || !input.startsWith('/api/')) {
            return window.__rawFetch(input, initOptions);
        }

        const url = new URL(input, 'https://local.open-reader');
        const pathname = url.pathname;

        // 1. 获取书源配置
        if (pathname === '/api/info') {
            const infoData = {
                port: 443,
                localIp: 'Local iOS',
                networkUrl: (typeof window !== 'undefined' && window.location ? window.location.href : ''),
                version: '独立免配版',
                categories: {
                    "小说": STANDALONE_RECOMMENDED_NOVELS,
                    "漫画": ["新新漫画", "全面漫画", "G社漫画", "番茄"]
                }
            };
            return new Response(JSON.stringify(infoData), {
                headers: { 'Content-Type': 'application/json; charset=utf-8' }
            });
        }

        // 2. 搜索
        if (pathname === '/api/search') {
            const title = url.searchParams.get('title') || '';
            const tab = url.searchParams.get('tab') || '小说';
            const source = url.searchParams.get('source') || 'ALL';
            const page = url.searchParams.get('page') || '1';

            if (source === 'ALL' || !source) {
                const candidates = (tab === '漫画') 
                    ? ['新新漫画', '全面漫画', 'G社漫画', '番茄']
                    : ['七猫', '百度', '淘小说', '番茄', '笔趣阁78'];

                const tasks = candidates.map(async s => {
                    try {
                        const q = '/search?title=' + encodeURIComponent(title) + '&tab=' + encodeURIComponent(tab) + '&source=' + encodeURIComponent(s) + '&page=' + page + '&disabled_sources=0';
                        const res = await directFetchWithFailover(q);
                        const list = res.data || [];
                        return list.map(item => ({ ...item, source: s, tab }));
                    } catch(e) {
                        return [];
                    }
                });

                const settled = await Promise.allSettled(tasks);
                const aggregated = [];
                settled.forEach(r => {
                    if (r.status === 'fulfilled' && Array.isArray(r.value)) aggregated.push(...r.value);
                });

                const exact = [];
                const fuzzy = [];
                aggregated.forEach(b => {
                    if (b.book_name === title) exact.push(b);
                    else fuzzy.push(b);
                });

                return new Response(JSON.stringify({ code: 0, msg: 'ok', data: [...exact, ...fuzzy] }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            }

            try {
                const q = '/search?title=' + encodeURIComponent(title) + '&tab=' + encodeURIComponent(tab) + '&source=' + encodeURIComponent(source) + '&page=' + page + '&disabled_sources=0';
                const data = await directFetchWithFailover(q);
                return new Response(JSON.stringify(data), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            } catch(e) {
                return new Response(JSON.stringify({ code: -1, msg: e.message, data: [] }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            }
        }

        // 3. 详情
        if (pathname === '/api/detail') {
            const book_id = url.searchParams.get('book_id') || '';
            const source = url.searchParams.get('source') || '七猫';
            const tab = url.searchParams.get('tab') || '小说';
            try {
                const q = '/detail?book_id=' + encodeURIComponent(book_id) + '&source=' + encodeURIComponent(source) + '&tab=' + encodeURIComponent(tab) + '&variable={}';
                const data = await directFetchWithFailover(q);
                return new Response(JSON.stringify(data), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            } catch(e) {
                return new Response(JSON.stringify({ code: -1, msg: e.message }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            }
        }

        // 4. 目录
        if (pathname === '/api/catalog') {
            const book_id = url.searchParams.get('book_id') || '';
            const source = url.searchParams.get('source') || '七猫';
            const tab = url.searchParams.get('tab') || '小说';
            try {
                const q = '/catalog?book_id=' + encodeURIComponent(book_id) + '&source=' + encodeURIComponent(source) + '&tab=' + encodeURIComponent(tab) + '&variable={}';
                const data = await directFetchWithFailover(q);
                return new Response(JSON.stringify(data), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            } catch(e) {
                return new Response(JSON.stringify({ code: -1, msg: e.message }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            }
        }

        // 5. 正文
        if (pathname === '/api/content') {
            const item_id = url.searchParams.get('item_id') || '';
            const source = url.searchParams.get('source') || '七猫';
            const tab = url.searchParams.get('tab') || '小说';
            const bookTitle = url.searchParams.get('title') || '';
            const chapTitle = url.searchParams.get('chap_title') || '';
            const chapIdx = parseInt(url.searchParams.get('chap_idx') || '0', 10);

            try {
                const q = '/content?item_id=' + encodeURIComponent(item_id) + '&source=' + encodeURIComponent(source) + '&tab=' + encodeURIComponent(tab) + '&version=5';
                const data = await directFetchWithFailover(q);
                const txt = data.content || '';

                if (txt && txt.length > 50 && !isPaywallOrAdText(txt)) {
                    data.content = cleanAdContent(txt);
                    return new Response(JSON.stringify(data), {
                        headers: { 'Content-Type': 'application/json; charset=utf-8' }
                    });
                }

                // 尝试秒级自动跨源救援
                if (bookTitle) {
                    const rescued = await standaloneAutoRescue(bookTitle, chapTitle, chapIdx);
                    if (rescued) {
                        return new Response(JSON.stringify(rescued), {
                            headers: { 'Content-Type': 'application/json; charset=utf-8' }
                        });
                    }
                }

                return new Response(JSON.stringify({
                    code: -1,
                    msg: '当前书源受限或无正文',
                    content: txt
                }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            } catch(e) {
                if (bookTitle) {
                    const rescued = await standaloneAutoRescue(bookTitle, chapTitle, chapIdx);
                    if (rescued) {
                        return new Response(JSON.stringify(rescued), {
                            headers: { 'Content-Type': 'application/json; charset=utf-8' }
                        });
                    }
                }
                return new Response(JSON.stringify({ code: -1, msg: e.message, content: '' }), {
                    headers: { 'Content-Type': 'application/json; charset=utf-8' }
                });
            }
        }

        return window.__rawFetch(input, initOptions);
    };

    async function standaloneAutoRescue(bookTitle, chapTitle, chapIdx) {
        const rescueSources = ['七猫', '百度', '番茄'];
        const cleanChap = (chapTitle || '').replace(/[第章\s]/g, '');

        for (const s of rescueSources) {
            try {
                const sq = '/search?title=' + encodeURIComponent(bookTitle) + '&tab=小说&source=' + encodeURIComponent(s) + '&page=1&version=5';
                const sData = await directFetchWithFailover(sq);
                const list = sData.data || [];
                const matchBook = list.find(b => b.book_name === bookTitle) || list[0];
                if (!matchBook) continue;

                const cq = '/catalog?book_id=' + encodeURIComponent(matchBook.book_id) + '&source=' + encodeURIComponent(s) + '&tab=小说&version=5';
                const cData = await directFetchWithFailover(cq);
                const cat = cData.data || [];
                if (cat.length === 0) continue;

                let targetChap = (chapIdx !== undefined && cat[chapIdx]) ? cat[chapIdx] : null;
                if (cleanChap) {
                    const found = cat.find(c => {
                        const ct = c.title.replace(/[第章\s]/g, '');
                        return ct.includes(cleanChap) || cleanChap.includes(ct);
                    });
                    if (found) targetChap = found;
                }
                if (!targetChap) targetChap = cat[0];

                const contQ = '/content?item_id=' + encodeURIComponent(targetChap.item_id) + '&source=' + encodeURIComponent(s) + '&tab=小说&version=5';
                const contData = await directFetchWithFailover(contQ);
                const txt = contData.content || '';

                if (txt.length > 50 && !isPaywallOrAdText(txt)) {
                    return {
                        code: 0,
                        msg: '已自动切换至免费书源【' + s + '】畅读',
                        autoSwitched: true,
                        newSource: s,
                        title: targetChap.title,
                        content: cleanAdContent(txt)
                    };
                }
            } catch(e) {}
        }
        return null;
    }


    let appConfig = null;

    let currentChapterIndex = 0;
    let currentBookInfo = null;
    let previousView = 'shelf';

    // 清洗原站广告与零宽字符，并精准识别是否为收费打赏拦截文本（正文极短且含拦截词才视为拦截）
    function isPaywallOrAdText(text) {
        if (!text || typeof text !== 'string') return true;
        const cleaned = cleanAdContent(text);
        if (cleaned.length < 200) {
            const paywallMarkers = [
                '专享内容', '打赏解锁', 'svip', 'SVIP', '用户中心',
                '免登录访问次数已达上限', '已转为内部会员', '不再为免费用户提供服务'
            ];
            return paywallMarkers.some(m => text.includes(m)) || cleaned.length < 30;
        }
        return false;
    }

    function cleanAdContent(text) {
        if (!text || typeof text !== 'string') return '';
        let clean = text.replace(/[\\u200B-\\u200F\\uFEFF\\u202A-\\u202E]/g, '');
        const adMarkers = [
            '您当前未登录',
            '您今日免登录访问次数',
            '📣晴天提醒您',
            '官方售后方式',
            '已转为内部会员',
            '一定一定要更新书源',
            '账号信息异常',
            '不再为免费用户提供服务',
            '为专享内容，如需观看',
            '为SVIP专享内容'
        ];
        for (const marker of adMarkers) {
            const idx = clean.indexOf(marker);
            if (idx !== -1) {
                clean = clean.substring(0, idx);
            }
        }
        return clean.trim();
    }

    function getLocalShelf() {

    function renderShelf() {
        const shelf = getLocalShelf();
        const grid = document.getElementById('shelfGrid');
        const empty = document.getElementById('shelfEmpty');

        if (shelf.length === 0) {
            grid.innerHTML = '';
            empty.style.display = 'block';

        empty.style.display = 'none';
        grid.innerHTML = shelf.map((b, idx) => `
            <div class="card" onclick="openBookFromShelf(${idx})">

                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="card-title">${b.book_name}</span>

                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <span class="card-tag">${b.source || '优质源'}</span>
                    <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="removeFromShelf(event, ${idx})">移出</button>

    function toggleBookShelf() {
        if (!currentBookInfo) return;
        let shelf = getLocalShelf();
        const existingIdx = shelf.findIndex(b => b.book_name === currentBookInfo.book_name);
        const btn = document.getElementById('shelfToggleBtn');

        if (existingIdx !== -1) {
            shelf.splice(existingIdx, 1);
            btn.innerHTML = '<i class="fas fa-plus"></i> 加书架';
        } else {
            shelf.unshift({
                ...currentBookInfo,
                tab: currentBookInfo.tab || document.getElementById('tabSelect').value || '小说',
                lastReadTitle: currentCatalog[currentChapterIndex]?.title || '未开始',
                lastReadIndex: currentChapterIndex
            });
            btn.innerHTML = '<i class="fas fa-check"></i> 已在书架';
        }
        saveLocalShelf(shelf);
        renderShelf();
    }

    function updateShelfProgress(chapTitle, chapIdx) {
        if (!currentBookInfo) return;
        let shelf = getLocalShelf();
        const item = shelf.find(b => b.book_name === currentBookInfo.book_name);
        if (item) {
            item.lastReadTitle = chapTitle;
            item.lastReadIndex = chapIdx;
            item.source = currentBookInfo.source;
            saveLocalShelf(shelf);
            renderShelf();
        }
        document.getElementById('readProgressText').innerText = `章节 ${chapIdx + 1} / ${currentCatalog.length}`;
    }

    function removeFromShelf(e, idx) {
        e.stopPropagation();
        let shelf = getLocalShelf();
        shelf.splice(idx, 1);
        saveLocalShelf(shelf);
        renderShelf();
    }

    function openBookFromShelf(idx) {
        const shelf = getLocalShelf();
        const book = shelf[idx];
        loadBookDetail(encodeURIComponent(JSON.stringify(book)), book.lastReadIndex || 0);

    async function loadBookDetail(encodedItem, autoReadIndex = null) {
        const book = JSON.parse(decodeURIComponent(encodedItem));

        currentBookInfo = { ...book, tab: activeTab };

        const shelf = getLocalShelf();
        const isIn = shelf.some(b => b.book_name === book.book_name);
        document.getElementById('shelfToggleBtn').innerHTML = isIn ? '<i class="fas fa-check"></i> 已在书架' : '<i class="fas fa-plus"></i> 加书架';

        const catalogList = document.getElementById('catalogList');
        catalogList.innerHTML = '<div style="color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> 正在加载章节目录...</div>';
        showView('detail');

        try {
            const res = await fetch(`/api/catalog?book_id=${encodeURIComponent(book.book_id)}&source=${encodeURIComponent(book.source)}&tab=${encodeURIComponent(activeTab)}`);
            const data = await res.json();
            currentCatalog = data.data || [];

            if (currentCatalog.length === 0) {
                catalogList.innerHTML = `
                    <div style="color:var(--text-muted); padding:20px; grid-column:1/-1; text-align:center;">

                    </div>

            catalogList.innerHTML = currentCatalog.map((chap, idx) => `

    async function readChapter(idx) {
        currentChapterIndex = idx;
        const chap = currentCatalog[idx];
        showView('reader');

        document.getElementById('readerChapTitle').innerText = chap.title;
        const container = document.getElementById('readerContainer');
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px;"><i class="fas fa-spinner fa-spin"></i> 正在加载正文内容...</div>';

        document.getElementById('prevBtn').disabled = (idx === 0);
        document.getElementById('nextBtn').disabled = (idx >= currentCatalog.length - 1);

        const tab = currentBookInfo.tab || '小说';
        updateShelfProgress(chap.title, idx);

        try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 6500);
            const res = await fetch(`/api/content?item_id=${encodeURIComponent(chap.item_id)}&source=${encodeURIComponent(currentBookInfo.source)}&tab=${encodeURIComponent(tab)}&book_id=${encodeURIComponent(currentBookInfo.book_id)}&title=${encodeURIComponent(currentBookInfo.book_name)}&chap_title=${encodeURIComponent(chap.title)}&chap_idx=${idx}`, {
                signal: controller.signal
            });
            clearTimeout(timer);
            const data = await res.json();

            // 1. 如果是漫画画卷
            if (data.images && data.images.length > 0) {
                const isStealth = document.body.getAttribute('data-theme') === 'stealth';
                if (isStealth) {
                    container.innerHTML = `
                        <div class="text-stream">
                            // [摸鱼阅读已开启 - 代码伪装模式]<br>
                            // 章节: ${chap.title}<br>
                            // 图像资源: ${data.images.length} 帧原画流<br>
                            // 按 ESC 或右上角摸鱼按钮即可恢复原画预览
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="img-stream">
                            ${data.images.map(img => `<img src="${img}" loading="lazy" />`).join('')}
                        </div>
                    `;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 2. 如果是小说纯文本
            const rawContent = data.content || (data.data && typeof data.data === 'string' ? data.data : '');
            const isPay = isPaywallOrAdText(rawContent);

            if (!isPay && rawContent && rawContent.length > 50) {
                // 如果后端自动救援切换了更优源，同步展示
                if (data.autoSwitched && data.newSource) {
                    currentBookInfo.source = data.newSource;
                    document.getElementById('detailSourceTag').innerText = data.newSource + ' · ' + tab;
                }

                const cleanedText = cleanAdContent(rawContent);
                const isStealth = document.body.getAttribute('data-theme') === 'stealth';
                if (isStealth) {
                    const formatted = cleanedText.split('\\n').map(line => `// ${line}`).join('\\n');
                    container.innerHTML = `<div class="text-stream">${formatted}</div>`;
                } else {
                    container.innerHTML = `<div class="text-stream">${cleanedText}</div>`;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 3. 遇到打赏拦截或受限，提供原地无缝换源
            const tipMsg = data.msg || (isPay ? '当前书源【' + currentBookInfo.source + '】要求打赏或SVIP专享' : '当前书源暂无完整正文');
            container.innerHTML = `
                <div style="background:rgba(235,94,40,0.12); border:1px solid rgba(235,94,40,0.35); border-radius:10px; padding:24px 16px; text-align:center; margin:14px 0;">
                    <div style="font-size:16px; font-weight:600; margin-bottom:8px; color:var(--text-main);">⚠️ ${tipMsg}</div>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:16px; line-height:1.6;">
                        已为您识别到《${currentBookInfo.book_name}》在【七猫 / 百度 / 番茄 / 淘小说】均有免费完整正文。<br>点击下方按钮即可一键原地无缝同步章节！
                    </div>
                    <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                        <button class="btn primary" onclick="autoSwitchToFreeSource()"><i class="fas fa-bolt"></i> 一键秒切免费源</button>
                        <button class="btn" onclick="openSwitchSourceModal()"><i class="fas fa-list"></i> 选择更多备用源</button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch(e) {
            const isTimeout = (e.name === 'AbortError' || (e.message && e.message.includes('abort')) || (e.message && e.message.includes('timeout')));
            const errorMsg = isTimeout ? '正文加载超时，源站当前响应较慢' : ('加载章节异常: ' + e.message);
            container.innerHTML = `
                <div style="background:rgba(235,94,40,0.12); border:1px solid rgba(235,94,40,0.35); border-radius:10px; padding:24px 16px; text-align:center; margin:14px 0;">
                    <div style="font-size:16px; font-weight:600; margin-bottom:8px; color:var(--text-main);">⚠️ ${errorMsg}</div>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:16px; line-height:1.6;">
                        建议一键秒切至稳定的全免书源【七猫 / 百度 / 番茄】继续畅读！
                    </div>
                    <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                        <button class="btn primary" onclick="autoSwitchToFreeSource()"><i class="fas fa-bolt"></i> 一键秒切免费源</button>
                        <button class="btn" onclick="readChapter(${idx})"><i class="fas fa-redo"></i> 重试本章</button>
                        <button class="btn" onclick="openSwitchSourceModal()"><i class="fas fa-list"></i> 选择更多备用源</button>
                    </div>
                </div>
            `;
        }
    }

    // 真正的原地无缝切源（保留当前章节进度与书架同步）
    async function seamlessSwitchSource(targetSource) {
        closeSourceModal();
        const curChap = currentCatalog[currentChapterIndex];
        const curChapTitle = curChap?.title || '';
        const curIdx = currentChapterIndex;
        const isReading = (document.getElementById('readerView').style.display === 'block');

        if (isReading) {
            document.getElementById('readerContainer').innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> 正在原地无缝同步至【${targetSource}】...</div>`;
        }

        try {
            // 1. 在目标书源检索同名作品
            const sRes = await fetch(`/api/search?title=${encodeURIComponent(currentBookInfo.book_name)}&tab=${encodeURIComponent(currentBookInfo.tab || '小说')}&source=${encodeURIComponent(targetSource)}`);
            const sData = await sRes.json();
            const list = sData.data || [];
            const match = list.find(b => b.book_name === currentBookInfo.book_name) || list[0];

            if (!match) {
                alert(`书源【${targetSource}】未检索到《${currentBookInfo.book_name}》，请尝试其他源。`);
                if (isReading) readChapter(curIdx);
                return;
            }

            // 2. 更新书籍信息并拉取新目录
            currentBookInfo = { ...match, source: targetSource, tab: currentBookInfo.tab || '小说' };
            document.getElementById('detailBookTitle').innerText = match.book_name;
            document.getElementById('detailSourceTag').innerText = targetSource + ' · ' + currentBookInfo.tab;

            const catRes = await fetch(`/api/catalog?book_id=${encodeURIComponent(match.book_id)}&source=${encodeURIComponent(targetSource)}&tab=${encodeURIComponent(currentBookInfo.tab)}`);
            const catData = await catRes.json();
            currentCatalog = catData.data || [];

            // 3. 智能对齐章节
            let targetIdx = curIdx;
            if (curChapTitle && currentCatalog.length > 0) {
                const cleanCur = curChapTitle.replace(/[第章\\s]/g, '');
                const foundIdx = currentCatalog.findIndex(c => {
                    const cleanT = c.title.replace(/[第章\\s]/g, '');
                    return cleanT.includes(cleanCur) || cleanCur.includes(cleanT);
                });
                if (foundIdx !== -1) targetIdx = foundIdx;
            }

            // 更新详情页目录渲染
            const catalogList = document.getElementById('catalogList');
            catalogList.innerHTML = currentCatalog.map((chap, idx) => `
                <div class="chap-btn ${targetIdx === idx ? 'read-active' : ''}" title="${chap.title}" onclick="readChapter(${idx})">
                    ${chap.title}
                </div>
            `).join('');

            // 如果当前在阅读器，直接加载对齐后的章节
            if (isReading) {
                readChapter(targetIdx);
            }
        } catch(e) {
            alert(`切源异常: ${e.message}`);
            if (isReading) readChapter(curIdx);
        }
    }

    function toggleTheme(themeName) {
        const cur = document.body.getAttribute('data-theme');
        if (cur === themeName) {
            document.body.removeAttribute('data-theme');
        } else {
            document.body.setAttribute('data-theme', themeName);
        }
    }

    function toggleStealth() {
        const cur = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', cur === 'stealth' ? 'dark' : 'stealth');
        if (document.getElementById('readerView').style.display === 'block') {
            readChapter(currentChapterIndex);
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleStealth();
        if (document.getElementById('readerView').style.display === 'block') {
            if (e.key === 'ArrowLeft') prevChapter();
            if (e.key === 'ArrowRight') nextChapter();
        }
    });

    init();
</script>
